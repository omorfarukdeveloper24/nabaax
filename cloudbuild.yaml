steps:

# ===============================
# STEP 0: Composer install
# ===============================
- name: 'php:8.2-cli'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      apt-get update
      apt-get install -y git unzip libzip-dev
      docker-php-ext-install zip

      curl -sS https://getcomposer.org/installer | php
      php composer.phar install --no-dev --prefer-dist --no-interaction
  env:
    - 'COMPOSER_MEMORY_LIMIT=-1'


# ===============================
# STEP 1: Sync code to GCS
# ===============================
- name: 'gcr.io/cloud-builders/gsutil'
  args:
    - '-m'
    - 'rsync'
    - '-r'
    - '-x'
    - '^(vendor|node_modules|storage/logs|\.env)'
    - '.'
    - 'gs://nabaax-static-media-bucket-1/app-files'


# ===============================
# STEP 2: Deploy on VM
# ===============================
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud compute ssh \
      --zone "us-central1-c" \
      "bornoeduinfo@instance-group-2-kvxj" \
      --project "project-3a2b1ad7-77c7-4b62-946" \
      --command "
        sudo gsutil rsync -r -x '^(vendor|node_modules|storage/logs|\.env)' \
        gs://nabaax-static-media-bucket-1/app-files /var/www/html/nabaax &&

        # 🔥 FIX PERMISSIONS PROPERLY
        sudo find /var/www/html/nabaax -type d -exec chmod 775 {} \; &&
        sudo find /var/www/html/nabaax -type f -exec chmod 664 {} \; &&

        sudo chown -R www-data:www-data /var/www/html/nabaax &&
        sudo chmod -R 775 /var/www/html/nabaax/storage &&
        sudo chmod -R 775 /var/www/html/nabaax/bootstrap/cache &&

        cd /var/www/html/nabaax &&

        php artisan migrate --force &&
        php artisan optimize
      "


options:
  logging: CLOUD_LOGGING_ONLY

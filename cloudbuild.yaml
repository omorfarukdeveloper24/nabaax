# ===============================
# STEP 0: Composer install
# ===============================
- name: 'php:8.2-cli'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      apt-get update
      apt-get install -y git unzip libzip-dev rsync
      docker-php-ext-install zip

      curl -sS https://getcomposer.org/installer | php
      php composer.phar install --no-dev --prefer-dist --no-interaction
  env:
    - 'COMPOSER_MEMORY_LIMIT=-1'

# ===============================
# STEP 1: (Optional) Upload to GCS
# ===============================
- name: 'gcr.io/cloud-builders/gsutil'
  args:
    - '-m'
    - 'rsync'
    - '-r'
    - '-x'
    - '^(vendor|node_modules|storage/logs|\.env)'
    - '.'
    - 'gs://nabaax-static-media-bucket-1/app-files'

options:
  logging: CLOUD_LOGGING_ONLY

# ===============================
# STEP 2: Deploy to VM via SSH (Direct from Cloud Build)
# ===============================
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      echo "Deploying code to VM..."
      gcloud compute ssh bornoeduinfo@instance-group-2-kvxj --zone=us-central1-c --command "
        sudo rsync -avz --delete /workspace/ /var/www/html/nabaax/;
        sudo chown -R www-data:www-data /var/www/html/nabaax;
        echo 'Deployment finished!';
      "

# ===============================
# STEP 0: Composer Install (Fixed with GD, ZIP, Autoloader)
# ===============================
- name: 'php:8.2-cli'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      apt-get update
      apt-get install -y git unzip libzip-dev libpng-dev libjpeg-dev libwebp-dev
      docker-php-ext-configure gd --with-jpeg --with-webp
      docker-php-ext-install gd zip

      curl -sS https://getcomposer.org/installer | php
      php composer.phar install --no-dev --prefer-dist --no-interaction --optimize-autoloader
  env:
    - 'COMPOSER_MEMORY_LIMIT=-1'

# ===============================
# STEP 1: NPM Install
# ===============================
- name: 'gcr.io/cloud-builders/npm'
  args: ['install']
  env:
    - 'NODE_OPTIONS=--max_old_space_size=4096'

# ===============================
# STEP 2: NPM Build
# ===============================
- name: 'gcr.io/cloud-builders/npm'
  args: ['run', 'build']
  env:
    - 'NODE_OPTIONS=--max_old_space_size=4096'

# ===============================
# STEP 3: Upload to GCS (Include vendor)
# ===============================
- name: 'gcr.io/cloud-builders/gsutil'
  args:
    - '-m'
    - 'rsync'
    - '-r'
    - '--exclude'
    - '^node_modules/.*'
    - '--exclude'
    - 'storage/logs'
    - '--exclude'
    - '.env'
    - '.'
    - 'gs://nabaax-static-media-bucket-1/app-files'

options:
  logging: CLOUD_LOGGING_ONLY

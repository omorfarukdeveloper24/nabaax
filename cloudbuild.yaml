steps:
  # ... আপনার আগের ৩টি ধাপ এখানে থাকবে ...
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['compute', 'images', 'create', 'nabaax-img-${SHORT_SHA}', '--source-disk=nabaax-managed-group-ctxd', '--source-disk-zone=us-central1-a', '--force']
  
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['compute', 'instance-templates', 'create', 'nabaax-tmpl-${SHORT_SHA}', '--source-instance=nabaax-managed-group-ctxd', '--instance-template-region=us-central1']

  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['compute', 'instance-groups', 'managed', 'rolling-action', 'start-update', 'nabaax-managed-group', '--version=template=nabaax-tmpl-${SHORT_SHA}', '--zone=us-central1-a']

# এই অংশটুকু নতুন যোগ করুন
options:
  logging: CLOUD_LOGGING_ONLY
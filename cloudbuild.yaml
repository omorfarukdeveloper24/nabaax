# ===============================
# STEP 0: Composer install
# ===============================
- name: 'php:8.2-cli'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      apt-get update
      apt-get install -y git unzip libzip-dev
      docker-php-ext-install zip

      curl -sS https://getcomposer.org/installer | php
      php composer.phar install --no-dev --prefer-dist --no-interaction
  env:
    - 'COMPOSER_MEMORY_LIMIT=-1'

# ===============================
# STEP 1: (Optional) NPM install
# ===============================
# যেহেতু plain JS/CSS ব্যবহার করছেন, build step optional
# যদি plain JS/CSS থাকে, npm install এবং build দরকার নেই
# Uncomment করলে চলবে যদি future এ কোনো JS bundling লাগে
# - name: 'gcr.io/cloud-builders/npm'
#   args: ['install']
#   env:
#     - 'NODE_OPTIONS=--max_old_space_size=4096'

# ===============================
# STEP 2: (Optional) NPM build
# ===============================
# Plain JS/CSS থাকলে build step লাগবে না
# - name: 'gcr.io/cloud-builders/npm'
#   args: ['run', 'build']
#   env:
#     - 'NODE_OPTIONS=--max_old_space_size=4096'

# ===============================
# STEP 3: Upload to GCS
# ===============================
- name: 'gcr.io/cloud-builders/gsutil'
  args:
    - '-m'
    - 'rsync'
    - '-r'
    - '--exclude'
    - '^vendor/.*'
    - '--exclude'
    - '^node_modules/.*'
    - '--exclude'
    - 'storage/logs'
    - '--exclude'
    - '.env'
    - '.'
    - 'gs://nabaax-static-media-bucket-1/app-files'

options:
  logging: CLOUD_LOGGING_ONLY

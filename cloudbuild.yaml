steps:
# ===============================
# STEP 0: Composer install
# ===============================
- name: 'php:8.2-cli'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      apt-get update
      apt-get install -y git unzip libzip-dev rsync
      docker-php-ext-install zip
      curl -sS https://getcomposer.org/installer | php
      php composer.phar install --no-dev --prefer-dist --no-interaction
  env:
    - 'COMPOSER_MEMORY_LIMIT=-1'

# ===============================
# STEP 1: (Optional) NPM install & build
# ===============================
# Uncomment if your project uses npm
# - name: 'gcr.io/cloud-builders/npm'
#   args: ['install']
#   env:
#     - 'NODE_OPTIONS=--max_old_space_size=4096'
#
# - name: 'gcr.io/cloud-builders/npm'
#   args: ['run', 'build']
#   env:
#     - 'NODE_OPTIONS=--max_old_space_size=4096'

# ===============================
# STEP 2: Deploy to VM via Cloud Build (direct)
# ===============================
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      echo "Deploying code to VM..."
      gcloud compute ssh bornoeduinfo@instance-group-2-kvxj \
        --zone=us-central1-c \
        --strict-host-key-checking=no \
        --command "
          sudo rsync -avz --delete /workspace/ /var/www/html/nabaax/;
          sudo chown -R www-data:www-data /var/www/html/nabaax;
          echo 'Deployment finished!';
        "

options:
  logging: CLOUD_LOGGING_ONLY


